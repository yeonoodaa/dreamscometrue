<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>🌙 Dreams Come True</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;800;900&family=Exo+2:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --lav:#7C6FD4;--lavd:#5B50B8;--lavm:#9B90E8;--lavl:#EEF0FF;
  --sky:#9BBDE8;--bdr:rgba(180,170,240,.5);--bdr2:rgba(180,170,240,.3);
  --px:'Orbitron',monospace;
}
body{font-family:'Exo 2','Apple SD Gothic Neo',sans-serif;background:linear-gradient(145deg,#EBE8FF 0%,#DBE8FF 45%,#E8F4FF 100%);min-height:100vh;color:#3D3580}
button{cursor:pointer;font-family:'Exo 2',sans-serif;border:none;transition:all .12s}
button:active{transform:scale(.96);opacity:.88}
input,textarea{font-family:'Exo 2',sans-serif;outline:none}
textarea{resize:none}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-thumb{background:rgba(155,144,232,.35);border-radius:4px}


/* LOGIN SCREEN */
#login{display:none;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(145deg,#EBE8FF 0%,#DBE8FF 45%,#E8F4FF 100%);min-height:100vh;position:relative;overflow:hidden;padding:32px 24px;text-align:center}
.login-box{background:rgba(255,255,255,.8);border:1.5px solid var(--bdr);border-radius:24px;padding:28px 24px;width:100%;max-width:320px;box-shadow:0 8px 32px rgba(124,111,212,.15);position:relative;z-index:1}
.login-logo{font-size:36px;margin-bottom:10px}
.login-title{font-family:var(--px);font-size:13px;font-weight:900;color:#4A4090;margin-bottom:4px;letter-spacing:1px}
.login-sub{font-family:var(--px);font-size:8px;color:#9898C8;margin-bottom:24px;letter-spacing:.5px}
.login-tab-row{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:rgba(245,240,255,.8);border-radius:12px;padding:3px;margin-bottom:20px}
.login-tab{padding:8px 0;border-radius:10px;font-family:var(--px);font-size:8px;color:#9898C8;background:transparent;border:none;cursor:pointer;font-weight:700;letter-spacing:.5px}
.login-tab.active{background:linear-gradient(135deg,var(--lav),var(--sky));color:#fff}
.login-field{width:100%;padding:11px 14px;border:1.5px solid var(--bdr);border-radius:12px;font-size:13px;font-weight:600;color:#3D3580;background:rgba(255,255,255,.8);margin-bottom:10px;font-family:inherit}
.login-field::placeholder{color:#B8B4DC}
.login-field:focus{border-color:var(--lav);outline:none}
.login-submit{width:100%;padding:13px;border-radius:14px;background:linear-gradient(135deg,var(--lavd),var(--lav),var(--sky));color:#fff;font-family:var(--px);font-size:9px;font-weight:900;letter-spacing:.5px;border:none;cursor:pointer;margin-top:4px;box-shadow:0 4px 16px rgba(124,111,212,.35)}
.login-submit:disabled{background:rgba(180,170,240,.3);color:#C0B8DC;box-shadow:none}
.login-err{font-size:11px;font-weight:700;color:#DC2626;margin-top:8px;min-height:16px}
.login-ok{font-size:11px;font-weight:700;color:#059669;margin-top:8px;min-height:16px}
.user-badge{display:flex;align-items:center;gap:8px;background:rgba(245,240,255,.8);border:1.5px solid var(--bdr);border-radius:12px;padding:6px 12px}
.user-email{font-family:var(--px);font-size:8px;color:var(--lavd);letter-spacing:.3px;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.logout-btn{font-family:var(--px);font-size:7px;color:#DC2626;background:rgba(254,202,202,.3);border:1px solid rgba(220,38,38,.25);border-radius:8px;padding:4px 8px;cursor:pointer;white-space:nowrap}
/* SCREENS */
#intro{display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(145deg,#EBE8FF 0%,#DBE8FF 45%,#E8F4FF 100%);min-height:100vh;position:relative;overflow:hidden;padding:32px 24px;text-align:center}
#app{display:none;min-height:100vh;padding:0 16px 100px}

/* ANIMATIONS */
@keyframes tw{0%,100%{opacity:.1;transform:scale(.7)}50%{opacity:.9;transform:scale(1.3)}}
@keyframes sh{0%{opacity:0;transform:translate(0,0) rotate(-38deg)}20%{opacity:1}100%{opacity:0;transform:translate(120px,75px) rotate(-38deg)}}
@keyframes fu{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes slideUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse-rec{0%,100%{box-shadow:0 0 0 8px rgba(239,68,68,.2)}50%{box-shadow:0 0 0 14px rgba(239,68,68,.1)}}
@keyframes blink{50%{opacity:0}}

.star{position:absolute;border-radius:50%;background:rgba(155,140,230,.6);animation:tw 3s ease-in-out infinite}
.shoot{position:absolute;height:1.5px;background:linear-gradient(to right,transparent,rgba(155,190,230,.5),transparent);animation:sh 1.6s ease-out infinite}

/* INTRO */
.intro-content{position:relative;z-index:1;animation:fu .9s both;max-width:320px;width:100%}
.monitor{width:100px;height:82px;background:linear-gradient(135deg,#A8A0E8,#90B8E8);border-radius:14px 14px 6px 6px;border:2px solid var(--bdr);box-shadow:0 8px 32px rgba(124,111,212,.2);display:flex;align-items:center;justify-content:center;margin:0 auto 6px;position:relative;overflow:hidden}
.monitor::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(255,255,255,.04) 2px,rgba(255,255,255,.04) 4px)}
.monitor-text{font-family:var(--px);font-size:11px;font-weight:900;color:#FDE68A;line-height:1.3;position:relative;z-index:1}
.monitor-stand{width:28px;height:8px;background:linear-gradient(135deg,#C8C4F4,#A8C4F0);margin:0 auto;border-radius:0 0 4px 4px;border:1.5px solid var(--bdr);border-top:none}
.monitor-base{width:54px;height:5px;background:linear-gradient(135deg,#DDD8F8,#B8D4F8);margin:0 auto 24px;border-radius:3px;border:1.5px solid var(--bdr)}
.intro-title{font-family:var(--px);font-size:18px;font-weight:900;color:#4A4090;margin-bottom:5px;letter-spacing:1px}
.intro-sub{font-family:var(--px);font-size:9px;color:var(--lav);letter-spacing:1px;margin-bottom:20px}
.date-chip{display:inline-block;background:rgba(255,255,255,.65);border:1.5px solid var(--bdr);border-radius:20px;padding:6px 20px;font-family:var(--px);font-size:9px;color:var(--lav);margin-bottom:22px;letter-spacing:.5px}
.mic-wrap{display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:8px}
.mic-btn{width:74px;height:74px;border-radius:50%;background:linear-gradient(135deg,var(--lav),var(--sky));box-shadow:0 8px 28px rgba(124,111,212,.25),0 0 0 10px rgba(180,200,240,.15);border:none;font-size:30px;display:flex;align-items:center;justify-content:center}
.mic-btn.recording{background:linear-gradient(135deg,#EF4444,#F87171);animation:pulse-rec 1s ease-in-out infinite}
.mic-label{font-family:var(--px);font-size:8px;color:var(--lav);letter-spacing:1px}
.mic-hint{font-size:10px;color:#B8B0D8;margin-bottom:10px}
.rec-timer{font-family:var(--px);font-size:10px;color:#EF4444;letter-spacing:1px}
.rec-preview{background:rgba(255,255,255,.65);border:1.5px solid var(--bdr);border-radius:12px;padding:10px 14px;font-size:12px;color:#5B50B8;line-height:1.6;font-weight:600;max-width:260px;text-align:left;margin:4px 0}
.voice-result{width:100%;max-width:260px;margin:0 auto 10px}
.voice-result-box{background:rgba(255,255,255,.72);border:1.5px solid var(--bdr);border-radius:14px;padding:12px 14px;margin-bottom:8px;text-align:left}
.voice-result-label{font-family:var(--px);font-size:8px;color:#9898C8;margin-bottom:6px;letter-spacing:.5px}
.voice-result-text{font-size:13px;color:#3D3580;line-height:1.7;font-weight:600}
.voice-btns{display:flex;gap:7px}
.btn-save-voice{flex:2;padding:10px 0;border-radius:12px;background:linear-gradient(135deg,var(--lav),var(--sky));color:#fff;font-family:var(--px);font-size:8px;font-weight:700;letter-spacing:.5px;border:none}
.btn-redo{flex:1;padding:10px 0;border-radius:12px;background:rgba(255,255,255,.7);border:1.5px solid var(--bdr);color:var(--lav);font-family:var(--px);font-size:8px;font-weight:700}
.or-line{display:flex;align-items:center;gap:10px;margin:4px auto 10px;width:220px}
.or-line::before,.or-line::after{content:'';flex:1;height:1px;background:var(--bdr)}
.or-line span{font-size:10px;color:#C0B8DC}
.press-btn{width:100%;max-width:260px;padding:14px 0;border-radius:12px;background:linear-gradient(135deg,var(--lav),var(--sky));color:#fff;font-family:var(--px);font-size:10px;font-weight:900;letter-spacing:1px;box-shadow:0 6px 24px rgba(124,111,212,.3);border:none;animation:blink 1.4s ease-in-out infinite}
.intro-hint{font-size:10px;color:#B8B0D8;margin-top:12px}

/* APP */
.app-wrap{max-width:420px;margin:0 auto}
.app-header{display:flex;align-items:center;justify-content:space-between;padding:20px 0 14px}
.logo-row{display:flex;align-items:center;gap:10px;cursor:pointer}
.logo-icon{width:34px;height:28px;background:linear-gradient(135deg,#C8C4F4,#B8D4F8);border-radius:8px 8px 4px 4px;border:2px solid var(--bdr);display:flex;align-items:center;justify-content:center;font-size:14px}
.logo-title{font-family:var(--px);font-size:12px;font-weight:900;color:#4A4090;letter-spacing:.5px}
.logo-sub{font-family:var(--px);font-size:8px;color:#9898C8;margin-top:1px}
.lv-chip{font-family:var(--px);font-size:8px;font-weight:900;color:#5B50B8;background:linear-gradient(135deg,rgba(200,195,255,.8),rgba(185,215,255,.8));border:1.5px solid var(--bdr);border-radius:8px;padding:5px 12px}
.tab-bar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;background:rgba(255,255,255,.55);border-radius:14px;padding:4px;border:1.5px solid var(--bdr);margin-bottom:18px}
.tab-btn{padding:9px 0;border-radius:11px;background:transparent;color:#9898C8;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:5px;border:2px solid transparent}
.tab-btn.active{background:linear-gradient(135deg,var(--lav),var(--sky));color:#fff;border-color:var(--lavd)}
.tab-pane{display:none;flex-direction:column;gap:10px;animation:slideUp .25s ease-out}
.tab-pane.active{display:flex}

/* CARD */
.card{background:rgba(255,255,255,.72);border:1.5px solid var(--bdr);border-radius:18px;overflow:hidden;box-shadow:0 4px 20px rgba(160,150,230,.12)}
.card-hdr{background:linear-gradient(90deg,rgba(210,205,255,.6),rgba(200,225,255,.6));padding:8px 14px;border-bottom:1.5px solid var(--bdr);display:flex;align-items:center;gap:6px}
.card-hdr-icon{font-size:14px}
.card-hdr-title{font-family:var(--px);font-size:9px;font-weight:700;color:var(--lav);letter-spacing:1.5px;text-transform:uppercase}
.card-body{padding:12px 14px}
.type-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.type-btn{border-radius:14px;padding:12px 0;text-align:center;background:rgba(255,255,255,.7);border:2.5px solid var(--bdr)}
.type-btn.sel-good{border-color:#FDE68A;background:rgba(253,230,138,.15);box-shadow:0 4px 16px rgba(253,230,138,.4)}
.type-btn.sel-normal{border-color:var(--lav);background:rgba(124,111,212,.08);box-shadow:0 4px 16px rgba(124,111,212,.25)}
.type-btn.sel-bad{border-color:#FECACA;background:rgba(254,202,202,.15);box-shadow:0 4px 16px rgba(254,202,202,.4)}
.type-em{font-size:24px;display:block;margin-bottom:4px}
.type-lbl{font-family:var(--px);font-size:7px;color:#9898C8}
.type-btn.sel-good .type-lbl{color:#D97706}
.type-btn.sel-normal .type-lbl{color:var(--lav)}
.type-btn.sel-bad .type-lbl{color:#DC2626}
.toggle{width:42px;height:23px;border-radius:12px;background:rgba(200,195,240,.4);border:2px solid var(--bdr);position:relative;cursor:pointer}
.toggle.on{background:linear-gradient(135deg,var(--lav),var(--sky));border-color:var(--lavd)}
.toggle-knob{position:absolute;top:2px;left:2px;width:15px;height:15px;background:#fff;border-radius:50%;box-shadow:1px 1px 3px rgba(0,0,0,.18);transition:left .2s}
.toggle.on .toggle-knob{left:21px}
.tag-wrap{display:flex;flex-wrap:wrap;gap:6px}
.tag-pill{display:flex;align-items:center;gap:4px;padding:6px 12px;border-radius:20px;border:1.5px solid var(--bdr);background:rgba(255,255,255,.75);color:var(--lav);font-size:12px;font-weight:700}
.tag-pill.sel{background:linear-gradient(135deg,var(--lav),var(--sky));color:#fff;border-color:var(--lavd)}
.dream-ta{width:100%;border:1.5px solid var(--bdr);border-radius:12px;padding:11px 13px;font-size:13px;font-weight:600;color:#3D3580;background:rgba(255,255,255,.75);line-height:1.7}
.dream-ta::placeholder{color:#B8B4DC}

/* AI */
.ai-tabs{display:flex;border-bottom:1.5px solid var(--bdr)}
.ai-tab{flex:1;padding:8px 0;text-align:center;font-family:var(--px);font-size:7px;color:#9898C8;background:rgba(255,255,255,.4);border-right:1.5px solid var(--bdr);letter-spacing:.5px;cursor:pointer}
.ai-tab:last-child{border-right:none}
.ai-tab.active{background:linear-gradient(135deg,var(--lav),var(--sky));color:#fff}
.ai-body{padding:12px 14px}
.ai-pane{display:none}
.ai-pane.active{display:block}
.ai-run-btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:10px;margin-bottom:10px;background:linear-gradient(135deg,var(--lavd),var(--lav));color:#fff;font-family:var(--px);font-size:7px;font-weight:700;letter-spacing:.5px;border:none;cursor:pointer}
.ai-txt{font-size:12px;font-weight:700;color:#3D3580;line-height:1.8}
.ai-ph{font-size:12px;color:#B8B4DC;font-weight:600}
.track-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:10px;background:rgba(255,255,255,.65);border:1px solid var(--bdr2);margin-bottom:5px}
.track-num{font-family:var(--px);font-size:7px;color:#9898C8;width:12px}
.track-name{font-size:12px;font-weight:700;color:#3D3580;flex:1}
.spotify-all-btn{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:10px;padding:9px;border-radius:12px;background:linear-gradient(135deg,#1DB954,#19a348);color:#fff;font-family:var(--px);font-size:8px;font-weight:700;letter-spacing:.5px;text-decoration:none;border:none}
.save-btn{width:100%;padding:15px 0;border-radius:16px;background:linear-gradient(135deg,var(--lavd),var(--lav),var(--sky));color:#fff;font-family:var(--px);font-size:9px;font-weight:900;letter-spacing:.5px;box-shadow:0 4px 20px rgba(124,111,212,.4);border:none}
.save-btn:disabled{background:rgba(180,170,240,.25);color:#C0B8DC;box-shadow:none}
.today-item{background:rgba(245,243,255,.8);border-radius:13px;padding:11px 12px;border:1px solid var(--bdr2);position:relative;margin-bottom:8px}
.today-row{display:flex;align-items:center;gap:7px;margin-bottom:5px;flex-wrap:wrap}
.mini-tag{font-family:var(--px);font-size:7px;padding:2px 8px;border-radius:10px;background:rgba(200,198,247,.4);color:var(--lavd);border:1.5px solid var(--bdr)}
.del-btn{position:absolute;top:9px;right:9px;background:none;border:none;opacity:.4;font-size:14px;padding:2px;cursor:pointer}
.card-make-btn{font-family:var(--px);font-size:7px;padding:3px 9px;border-radius:9px;background:rgba(83,74,183,.12);color:var(--lav);border:1.5px solid var(--bdr);margin-left:auto;cursor:pointer}

/* CALENDAR */
.search-bar{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.75);border:1.5px solid var(--bdr);border-radius:14px;padding:9px 14px}
.search-bar input{flex:1;border:none;background:transparent;font-size:13px;font-weight:600;color:#3D3580}
.search-clear{background:none;border:none;font-size:14px;color:#9898C8;cursor:pointer}
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}
.cal-nav-btn{background:rgba(255,255,255,.8);border:1.5px solid var(--bdr);border-radius:9px;padding:5px 10px;color:var(--lav);font-size:14px;font-family:var(--px);cursor:pointer}
.cal-month{font-family:var(--px);font-size:10px;font-weight:900;color:#4A4090}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-dh{text-align:center;font-family:var(--px);font-size:6px;padding:3px 0;color:#9898C8}
.cal-dh.sun{color:#E88080}.cal-dh.sat{color:#80B0E8}
.cal-day{display:flex;flex-direction:column;align-items:center;padding:5px 0;border-radius:10px;cursor:pointer}
.cal-day:hover{background:rgba(180,170,240,.15)}
.cal-day.today{background:rgba(155,144,232,.2)}
.cal-day.today .cal-num{color:var(--lav);font-weight:900}
.cal-day.sel{background:linear-gradient(135deg,var(--lav),var(--sky))}
.cal-day.sel .cal-num{color:#fff;font-weight:900}
.cal-num{font-size:12px;font-weight:600;color:#4A4490}
.cal-dot{width:5px;height:5px;border-radius:50%;margin-top:2px}
.cal-legend{display:flex;gap:12px;margin-top:10px;padding-top:8px;border-top:1px solid var(--bdr2)}
.leg{display:flex;align-items:center;gap:4px;font-family:var(--px);font-size:5px;color:#9898C8}

/* STATS */
.lv-card{background:linear-gradient(135deg,var(--lavd),var(--lav),var(--sky));border-radius:18px;padding:16px 18px;box-shadow:0 4px 20px rgba(124,111,212,.25)}
.lv-top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.lv-av{width:46px;height:46px;border-radius:13px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:26px;border:2px solid rgba(255,255,255,.3)}
.lv-name{font-family:var(--px);font-size:8px;color:#fff;margin-bottom:4px;letter-spacing:.5px}
.lv-sub{font-size:11px;font-weight:600;color:rgba(255,255,255,.65)}
.lv-num{font-family:var(--px);font-size:22px;font-weight:900;color:#FDE68A;margin-left:auto}
.lv-bar-bg{height:8px;background:rgba(255,255,255,.2);border-radius:4px;overflow:hidden}
.lv-bar-fill{height:8px;background:linear-gradient(90deg,#FDE68A,#fff);border-radius:4px;transition:width .6s}
.lv-labels{display:flex;justify-content:space-between;margin-top:4px}
.lv-lbl{font-family:var(--px);font-size:5px;color:rgba(255,255,255,.45)}
.stat3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.stat-card{background:rgba(255,255,255,.72);border:1.5px solid var(--bdr);border-radius:14px;padding:12px 6px;text-align:center}
.stat-em{font-size:22px;margin-bottom:4px}
.stat-val{font-family:var(--px);font-size:13px;font-weight:900;color:#4A4090;margin-bottom:2px}
.stat-lbl{font-family:var(--px);font-size:5px;color:#9898C8}
.badge-row{display:flex;gap:9px;overflow-x:auto;padding-bottom:4px}
.badge-item{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:4px}
.badge-icon{width:50px;height:50px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px}
.badge-icon.earned{background:linear-gradient(135deg,rgba(180,170,240,.5),rgba(155,190,232,.4));border:1.5px solid var(--bdr)}
.badge-icon.locked{background:rgba(255,255,255,.3);border:1.5px solid var(--bdr2);filter:grayscale(1);opacity:.4}
.badge-name{font-family:var(--px);font-size:5px;color:var(--lav);text-align:center;max-width:50px;line-height:1.4}
.badge-name.locked{color:#C0B8DC}
.wc-wrap{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:4px 0}
.wc-word{font-weight:900;border-radius:20px;border:1px solid var(--bdr2);background:rgba(124,111,212,.1);color:var(--lavd);cursor:default}
.exp-btn{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:13px;border:1px solid var(--bdr);background:rgba(255,255,255,.65);margin-bottom:7px;width:100%;cursor:pointer}
.exp-ic{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:20px;border:1.5px solid var(--bdr);flex-shrink:0}
.exp-title{font-family:var(--px);font-size:7px;color:#4A4090;margin-bottom:2px;letter-spacing:.5px}
.exp-sub{font-size:11px;font-weight:700;color:#9898C8}
.widget-preview{background:linear-gradient(145deg,#EBE8FF,#DBE8FF,#E8F4FF);border-radius:14px;padding:13px 14px;border:1.5px solid var(--bdr);margin-bottom:10px}
.shortcut-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}

// ── 유틸 ──
function dk(y,m,d){return y+"-"+("0"+(m+1)).slice(-2)+"-"+("0"+d).slice(-2);}
function tdk(){var d=new Date();return dk(d.getFullYear(),d.getMonth(),d.getDate());}
function daysIn(y,m){return new Date(y,m+1,0).getDate();}
function firstWd(y,m){return new Date(y,m,1).getDay();}
function fl(d){var r=[];Object.values(d).forEach(function(a){a.forEach(function(x){r.push(x);});});return r;}
function calcStreak(dreams){
  var s=0,t=new Date();
  for(var i=0;i<365;i++){
    var dd=new Date(t);dd.setDate(dd.getDate()-i);
    var k=dk(dd.getFullYear(),dd.getMonth(),dd.getDate());
    if(dreams[k]&&dreams[k].length)s++;else break;
  }
  return s;
}
function findRepeats(dreams){
  var c={};
  fl(dreams).forEach(function(d){if(d.tag)c[d.tag]=(c[d.tag]||0)+1;});
  return Object.entries(c).filter(function(e){return e[1]>=3;}).map(function(e){return e[0];});
}
function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function hlText(text,q){
  if(!q||!text)return esc(text||"");
  var idx=text.indexOf(q);
  if(idx===-1)return esc(text);
  return esc(text.slice(0,idx))+'<mark style="background:rgba(155,189,232,.4);border-radius:3px;padding:0 2px;color:#4A6EAA">'+esc(text.slice(idx,idx+q.length))+'</mark>'+esc(text.slice(idx+q.length));
}
function getDot(k){
  var l=S.dreams[k];if(!l||!l.length)return null;
  if(l.some(function(d){return d.type==="good";}))return"#FDE68A";
  if(l.some(function(d){return d.type==="bad";}))return"#FECACA";
  return MOODS[(l[l.length-1].moodIdx||0)].color;
}

// ── API ──
function getKey(){return window.__DCT_KEY||"";}
function saveApiKey(){
  var k=document.getElementById("api-input").value.trim();
  if(k){window.__DCT_KEY=k;localStorage.setItem("dct_apikey",k);document.getElementById("api-banner").classList.add("hidden");showToast("✦ API KEY 저장됐어요!");}
}
(function(){var s=localStorage.getItem("dct_apikey");if(s){window.__DCT_KEY=s;document.getElementById("api-banner").classList.add("hidden");}})();

function aiCall(prompt,maxTok,callback){
  var key=getKey();
  if(!key){callback(null,"NO_KEY");return;}
  var xhr=new XMLHttpRequest();
  xhr.open("POST","https://api.anthropic.com/v1/messages",true);
  xhr.setRequestHeader("Content-Type","application/json");
  xhr.setRequestHeader("x-api-key",key);
  xhr.setRequestHeader("anthropic-version","2023-06-01");
  xhr.setRequestHeader("anthropic-dangerous-direct-browser-access","true");
  xhr.onload=function(){
    if(xhr.status===200){
      try{
        var d=JSON.parse(xhr.responseText);
        callback(d.content[0].text.trim(),null);
      }catch(e){callback(null,e.toString());}
    }else{callback(null,"HTTP "+xhr.status);}
  };
  xhr.onerror=function(){callback(null,"Network error");};
  xhr.send(JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:maxTok||200,messages:[{role:"user",content:prompt}]}));
}

var recObj=null,recInt=null,recSec=0;
function startRec(){
  if(!("webkitSpeechRecognition" in window||"SpeechRecognition" in window)){alert("Chrome 브라우저에서 열어주세요!");return;}
  document.getElementById("mic-idle").style.display="none";
  document.getElementById("press-start").style.display="none";
  var mr=document.getElementById("mic-recording");
  mr.style.display="flex";mr.style.flexDirection="column";mr.style.alignItems="center";
  recSec=0;updateTimer();
  recInt=setInterval(function(){recSec++;updateTimer();},1000);
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  recObj=new SR();recObj.lang="ko-KR";recObj.continuous=false;recObj.interimResults=true;
  recObj.onresult=function(e){

// ── 탭 전환 ──
function switchTab(tab){
  S.tab=tab;S.selDay=null;S.searchQ="";
  var tabBtns=document.querySelectorAll(".tab-btn");
  var tabIds=["record","calendar","stats"];
  tabBtns.forEach(function(b,i){b.classList.toggle("active",tabIds[i]===tab);});
  var paneIds=["tab-record","tab-calendar","tab-stats"];
  paneIds.forEach(function(id,i){
    var el=document.getElementById(id);
    if(!el)return;
    var isA=tabIds[i]===tab;
    el.classList.toggle("active",isA);
    el.style.display=isA?"flex":"none";
    if(isA){el.style.flexDirection="column";el.style.gap="10px";}
  });
  render();
}

function doPlaylist(){
  if(S.ldP)return;S.ldP=true;S.playlist=null;renderRecord();
  var t=TAGS.find(function(x){return x.id===S.selTag;});
  var md=S.dtype==="good"?"행복하고 설레는 기분의 길몽":S.dtype==="bad"?"긴장되고 무거운 악몽":"잔잔하고 몽환적인 일반 꿈";
  var prompt="당신은 Spotify에서 활동하는 감각적인 음악 큐레이터입니다.\n아래 꿈의 분위기에 딱 맞는 실제 인기 곡 5개를 추천해주세요.\nK-POP, 팝, 인디, R&B 등 장르 불문하고 분위기에 맞는 곡으로 골라주세요.\n실제로 존재하는 곡만 추천하고 최근 2-3년 이내 인기곡을 우선으로 해주세요.\n\n꿈 분위기: "+md+"\n꿈 키워드: "+(t?t.e+" "+t.l:"없음")+"\n꿈 내용 힌트: "+(S.content?S.content.slice(0,60):"없음")+"\n\n정확히 아래 형식으로만 답하세요:\nTITLE: [한국어 플레이리스트 이름]\nVIBE: [분위기 한 줄]\n1. [곡명] - [아티스트]\n2. [곡명] - [아티스트]\n3. [곡명] - [아티스트]\n4. [곡명] - [아티스트]\n5. [곡명] - [아티스트]\nSPOTIFY: [Spotify 검색용 영어 키워드]";
  aiCall(prompt,450,function(res,err){
    if(res){
      var lines=res.split("\n").map(function(l){return l.trim();}).filter(Boolean);
      var tracks=lines.filter(function(l){return /^\d\./.test(l);}).map(function(l){return l.replace(/^\d\.\s*/,"");});

      if(S.playlist.vibe.startsWith("VIBE:"))S.playlist.vibe=S.playlist.vibe.slice(5).trim();
    }else{
      S.playlist={title:"드림 플레이리스트",vibe:"꿈에 어울리는 음악",tracks:["Magnetic - ILLIT","Supernova - aespa","SPOT! - ZICO","How Sweet - NewJeans","Sticky - KISS OF LIFE"],spotifySearch:"K-POP dream chill 2024",spotifyLinks:["https://open.spotify.com/search/Magnetic%20ILLIT","https://open.spotify.com/search/Supernova%20aespa","https://open.spotify.com/search/SPOT%20ZICO","https://open.spotify.com/search/How%20Sweet%20NewJeans","https://open.spotify.com/search/Sticky%20KISS%20OF%20LIFE"]};
    }
    S.ldP=false;renderRecord();
  });
}

function saveDream(){
  if(!S.content.trim()&&!S.selTag)return;
  var d={id:Date.now(),date:tdk(),content:S.content,type:S.dtype,isLucid:S.lucid,tag:S.selTag,moodIdx:0,haemong:S.haemong||(S.selTag?FB[S.selTag]:FBD),story:S.story,playlist:S.playlist};
  if(!S.dreams[tdk()])S.dreams[tdk()]=[];
  S.dreams[tdk()].push(d);
  saveDreams();
  // DB에도 저장
  saveDreamToDB(d, function(saved){
    if(saved){
      // DB에서 받은 UUID로 id 교체
      var list = S.dreams[tdk()];
      var idx = list.findIndex(function(x){return x.id === d.id;});
      if(idx !== -1) list[idx].id = saved.id;
    }
  });
  S.content="";S.selTag=null;S.lucid=false;S.dtype="normal";S.haemong="";S.story="";S.playlist=null;
  showToast("★ DREAM SAVED!");
  switchTab("calendar");
}
function delDream(date,id){
  // UUID 형태면 문자열 비교, 숫자면 숫자 비교
  S.dreams[date]=(S.dreams[date]||[]).filter(function(d){return String(d.id)!==String(id);});
  if(!S.dreams[date].length)delete S.dreams[date];
  saveDreams();
  deleteDreamFromDB(id, function(){});
  renderRecord();
}

function switchLoginTab(mode){
  loginMode = mode;
  document.getElementById("tab-signin").classList.toggle("active", mode==="signin");
  document.getElementById("tab-signup").classList.toggle("active", mode==="signup");
  document.getElementById("login-btn").textContent = mode==="signin" ? "LOGIN ▶" : "SIGN UP ▶";
  document.getElementById("login-name-wrap").style.display = mode==="signup" ? "block" : "none";
  document.getElementById("login-err").textContent = "";
  document.getElementById("login-ok").textContent = "";
}

function doLogin(){
  var email = document.getElementById("login-email").value.trim();
  var pw = document.getElementById("login-pw").value.trim();
  var errEl = document.getElementById("login-err");
  var okEl = document.getElementById("login-ok");
  var btn = document.getElementById("login-btn");
  if(!email || !pw){ errEl.textContent = "이메일과 비밀번호를 입력해주세요"; return; }
  if(pw.length < 6){ errEl.textContent = "비밀번호는 6자 이상이어야 해요"; return; }
  btn.disabled = true;
  errEl.textContent = "";
  okEl.textContent = "";
  if(loginMode === "signup"){
    supabase.auth.signUp({email:email, password:pw}).then(function(res){
      btn.disabled = false;
      if(res.error){ errEl.textContent = res.error.message; return; }
      okEl.textContent = "가입 완료! 이메일을 확인하거나 바로 로그인해보세요 ✦";
    });
  } else {
    supabase.auth.signInWithPassword({email:email, password:pw}).then(function(res){
      btn.disabled = false;
      if(res.error){ errEl.textContent = "이메일 또는 비밀번호가 틀렸어요"; return; }
    });
  }
}

function doLogout(){
  supabase.auth.signOut().then(function(){
    S.dreams = {};
    showToast("로그아웃 됐어요 🌙");
  });
}

// ── DB 저장/불러오기 ──
function loadDreamsFromDB(callback){
  if(!currentUser){ if(callback) callback(); return; }
  supabase.from("dreams").select("*").order("date", {ascending:false}).then(function(res){
    if(res.error){ console.error("DB 로드 실패:", res.error); if(callback) callback(); return; }
    // DB 데이터를 S.dreams 형태로 변환
    S.dreams = {};
    (res.data||[]).forEach(function(row){
      if(!S.dreams[row.date]) S.dreams[row.date] = [];
      S.dreams[row.date].push({
        id: row.id,
        date: row.date,
        content: row.content || "",
        type: row.type || "normal",
        isLucid: row.is_lucid || false,
        tag: row.tag || null,
        haemong: row.haemong || "",
        story: row.story || "",
        playlist: row.playlist || null
      });
    });
    if(callback) callback();
  });
}

function saveDreamToDB(dream, callback){
  if(!currentUser){ if(callback) callback(); return; }
  supabase.from("dreams").insert({
    user_id: currentUser.id,
    date: dream.date,
    content: dream.content || "",
    type: dream.type || "normal",
    is_lucid: dream.isLucid || false,
    tag: dream.tag || null,
    haemong: dream.haemong || "",
    story: dream.story || "",
    playlist: dream.playlist || null
  }).select().then(function(res){
    if(res.error){ console.error("DB 저장 실패:", res.error); if(callback) callback(null); return; }
    if(callback) callback(res.data && res.data[0]);
  });
}

function deleteDreamFromDB(id, callback){
  if(!currentUser){ if(callback) callback(); return; }
  supabase.from("dreams").delete().eq("id", id).then(function(res){
    if(callback) callback();
  });
}
